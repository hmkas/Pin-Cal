name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test core
        run: swift test --package-path Packages/PinCalCore
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project PinCal.xcodeproj -scheme PinCal -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' build
          ditto -c -k --keepParent build/Build/Products/Release/Pin-Cal.app Pin-Cal.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Pin-Cal.zip
      - name: Update Homebrew cask
        env:
          # Fine-grained token with "Contents: read and write" on hmkas/homebrew-tap.
          # Only this step sees it. Without it the release still works; the cask update is skipped.
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_GITHUB_TOKEN not set; skipping cask update"; exit 0; fi
          VERSION="${GITHUB_REF_NAME#v}"
          # The cask is Ruby that runs on users' Macs: only accept plain version numbers.
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Refusing unexpected version '$VERSION'"; exit 1; }
          SHA=$(shasum -a 256 Pin-Cal.zip | awk '{print $1}')
          # Pass the token as a header so it isn't stored in tap/.git/config.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          git -c http.extraheader="$AUTH" clone https://github.com/hmkas/homebrew-tap.git tap
          cd tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            Casks/pin-cal.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pin-cal ${VERSION}" && git -c http.extraheader="$AUTH" push || echo "Cask already up to date"
